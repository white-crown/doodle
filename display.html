<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doodle Wall Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg1: #1d4a3b; --bg2: #0a1f19; --text: #fdf8ef; --soft: #cfe3d8; --accent: #c8323b; --accent-ink: #fff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: radial-gradient(130% 90% at 50% 0%, var(--bg1) 0%, var(--bg2) 75%); color: var(--text); font-family: 'Fredoka', system-ui, sans-serif; cursor: none; transition: background .8s; }
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  #decor { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  #decor svg { position: absolute; overflow: visible; }
  #wall { position: fixed; inset: 0; z-index: 1; }

  .title { position: fixed; top: 2.2vh; left: 0; right: 0; text-align: center; z-index: 5; pointer-events: none; }
  .title h1 { margin: 0; font-size: clamp(28px, 4.4vh, 64px); font-weight: 700; text-shadow: 0 4px 24px rgba(0,0,0,.4); }
  .title p { margin: .3vh 0 0; font-size: clamp(14px, 2vh, 28px); color: var(--soft); }
  body[data-theme=qatar] .title { top: 34vh; left: 4vw; right: auto; width: 28vw; text-align: left; }
  body[data-theme=qatar] .title h1 { font-size: clamp(32px, 6vh, 84px); line-height: 1.05; }
  body[data-theme=qatar] .title p { margin-top: 1.4vh; font-size: clamp(14px, 2.3vh, 30px); }

  .join { position: fixed; right: 2vh; bottom: 2vh; z-index: 5; background: var(--text); color: #23201c; border-radius: 2vh; padding: 1.4vh; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
  .join #qr { width: 17vh; height: 17vh; }
  .join #qr img, .join #qr canvas { width: 100% !important; height: 100% !important; }
  .join b { display: block; margin-top: .8vh; font-size: 2vh; }
  .count { position: fixed; left: 2vh; bottom: 2vh; z-index: 5; color: var(--soft); font-size: 2vh; }

  .item { position: absolute; left: 0; top: 0; will-change: transform; transform-origin: 50% 0; transition: transform 1.1s cubic-bezier(.5,0,.2,1), opacity .8s ease; z-index: 1; }
  .item .sway { animation: sway 5s ease-in-out infinite alternate; transform-origin: 50% 0; }
  .item img { display: block; width: 100%; height: auto; filter: drop-shadow(0 6px 10px rgba(0,0,0,.35)); }
  .item .who { text-align: center; font-size: 12px; color: var(--soft); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item.popping, .item.carried { z-index: 10; }
  .item.popping .sway, .item.carried .sway { animation: none; }
  .item.popping .who, .item.carried .who { opacity: 0; }
  .item .banner { position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); white-space: nowrap; background: var(--accent); color: var(--accent-ink); padding: 3px 10px; border-radius: 999px; font-size: 9px; font-weight: 600; opacity: 0; transition: opacity .3s; margin-bottom: 4px; }
  .item.popping .banner { opacity: 1; }
  .item.leaving { opacity: 0; }
  @keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
  @keyframes popin { 0% { transform: scale(0) rotate(-20deg); } 70% { transform: scale(1.12) rotate(4deg); } 100% { transform: scale(1) rotate(0); } }
  .pop-anim { animation: popin .7s cubic-bezier(.2,1.4,.4,1) both; }

  /* Falcon */
  .falcon { position: fixed; left: 0; top: 0; z-index: 20; pointer-events: none; display: none; will-change: transform; }
  .falcon .body { position: absolute; transform-origin: 50% 74%; }
  .falcon svg { width: 100%; height: 100%; display: block; overflow: visible; filter: drop-shadow(0 10px 12px rgba(0,0,0,.4)); }
  .falcon .wing { transform-box: view-box; animation: flap .3s ease-in-out infinite alternate; }
  .falcon .wing.front { transform-origin: 92px 68px; }
  .falcon .wing.back { transform-origin: 102px 64px; animation-delay: -.05s; }
  @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(-.55); } }
  .falcon.glide .wing { animation-duration: .9s; }

  .balloons { position: fixed; left: 0; top: 0; z-index: 20; pointer-events: none; display: none; will-change: transform; }
  .balloons .body { position: absolute; }
  .balloons svg { width: 100%; height: 100%; display: block; overflow: visible; animation: bob 2.4s ease-in-out infinite alternate; transform-origin: 50% 99%; filter: drop-shadow(0 8px 10px rgba(0,0,0,.3)); }
  @keyframes bob { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }

  .offline { position: fixed; top: 1vh; right: 1vh; width: 10px; height: 10px; border-radius: 50%; background: #e55; z-index: 6; display: none; }
</style>
</head>
<body data-theme="christmas">
<canvas id="fx"></canvas>
<div id="decor"></div>
<div id="wall"></div>
<div class="title"><h1 id="title"></h1><p id="tagline"></p></div>
<div class="join"><div id="qr"></div><b>Scan to draw</b></div>
<div class="count" id="count"></div>
<div class="offline" id="offline"></div>

<div class="falcon" id="falcon"><div class="body">
  <svg viewBox="0 0 200 130" aria-hidden="true">
    <defs>
      <linearGradient id="fWing" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#6b5444"/><stop offset=".6" stop-color="#4e3d33"/><stop offset="1" stop-color="#2f2621"/></linearGradient>
      <linearGradient id="fBack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b4a3f"/><stop offset="1" stop-color="#7d6555"/></linearGradient>
    </defs>
    <!-- far wing -->

    <!-- head: dark hood, cream cheek, the falcon "moustache" -->

    <!-- hooked beak with yellow cere -->

    <path d="M172 53 C179 53 183 58 181 65 C179 62 176 61 172 61 Z" fill="#3a3b44"/>
    <path d="M181 65 C181 62 179 61 177 61" stroke="#1a1a20" stroke-width="1.2" fill="none"/>
    <!-- eye: yellow ring, dark eye, highlight -->
    <circle cx="162" cy="54" r="4.6" fill="#f2c230"/>

    <circle cx="163.4" cy="52.9" r="1" fill="#fff"/>
    <!-- near wing: long and pointed with barred flight feathers -->
    <g class="wing front">
      <path d="M100 70 C98 50 88 28 52 -4 L60 12 L48 6 L58 20 L44 16 L56 30 L42 28 L56 42 L44 42 L60 52 C70 58 80 64 88 72 Z" fill="url(#fWing)"/>
      <path d="M58 20 L84 50 M56 30 L80 56 M56 42 L76 60 M60 12 L86 44" stroke="#2a211c" stroke-width="1.6" opacity=".7"/>
      <path d="M88 72 C84 60 80 50 74 42 C84 50 92 58 100 70 Z" fill="#8a705e"/>
    </g>
  </svg>
</div></div>

<div class="balloons" id="balloons"><div class="body">
  <svg viewBox="0 0 120 160" aria-hidden="true">
    <path d="M35 62 Q42 112 60 158 M60 52 Q56 106 60 158 M85 67 Q78 114 60 158" stroke="rgba(255,255,255,.85)" stroke-width="1.4" fill="none"/>
    <ellipse cx="35" cy="38" rx="20" ry="24" fill="#ff5d8f"/><path d="M31 63 L39 63 L35 58 Z" fill="#ff5d8f"/>
    <ellipse cx="85" cy="43" rx="20" ry="24" fill="#ffe066"/><path d="M81 68 L89 68 L85 63 Z" fill="#ffe066"/>
    <ellipse cx="60" cy="28" rx="20" ry="24" fill="#4cc9f0"/><path d="M56 53 L64 53 L60 48 Z" fill="#4cc9f0"/>
    <ellipse cx="28" cy="28" rx="5" ry="8" fill="#fff" opacity=".45"/><ellipse cx="53" cy="18" rx="5" ry="8" fill="#fff" opacity=".45"/><ellipse cx="78" cy="33" rx="5" ry="8" fill="#fff" opacity=".45"/>
  </svg>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="shared.js"></script>
<script>
(function () {
  var db = DW.client();
  var params = new URLSearchParams(location.search);
  var theme = 'christmas', cfg = {};

  // QR points at the phone page. ?join=<url> overrides it (needed when testing on localhost).
  var joinUrl = params.get('join') || new URL('index.html' + (DW.EVENT !== 'main' ? '?e=' + encodeURIComponent(DW.EVENT) : ''), location.href).href;
  new QRCode(document.getElementById('qr'), { text: joinUrl, width: 400, height: 400, correctLevel: QRCode.CorrectLevel.M });

  var wall = document.getElementById('wall');
  var items = new Map();      // id -> { el, slot, row }
  var slots = [], cell = 100;
  var queue = [], busy = false;
  var W = innerWidth, H = innerHeight;
  function maxOnWall() { return DW.MAX_PARAM ? Math.min(200, Math.max(6, DW.MAX_PARAM)) : DW.theme(theme).max; }

  // ---------------------------------------------------------------- theme
  var lastSizes = '';
  // Size settings from the operator, in percent (100 = normal).
  function bgOpt(k) {
    var v = +(DW.backgroundFor(cfg, theme)[k] || 100);
    return Math.max(40, Math.min(250, v || 100)) / 100;
  }
  function applyTheme(next) {
    cfg = next || {};
    var changed = theme !== (DW.THEMES[cfg.theme] ? cfg.theme : 'christmas');
    theme = DW.THEMES[cfg.theme] ? cfg.theme : 'christmas';
    if (DW.THEME_OVERRIDE && DW.THEMES[DW.THEME_OVERRIDE]) theme = DW.THEME_OVERRIDE;
    var t = DW.theme(theme);
    DW.applyVars(theme, cfg);
    document.getElementById('title').textContent = params.get('title') || cfg.title || t.title;
    document.getElementById('tagline').textContent = params.get('tagline') || cfg.tagline || t.tagline;
    fx.setMode(theme);
    var sz = JSON.stringify([bgOpt('items'), bgOpt('map')]);
    if (changed || !slots.length || sz !== lastSizes) layout();
    lastSizes = sz;
  }

  // ---------------------------------------------------------------- layout
  var mapPath = null, mapBox = null;
  function drawDecor() {
    var decor = document.getElementById('decor');
    decor.innerHTML = ''; mapPath = null; mapBox = null;
    if (theme !== 'qatar') return;
    var m = DW.QATAR_MAP;
    var mh = H * 0.97 * bgOpt('map'), mw = mh * m.w / m.h;
    if (mw > W * 0.62) { mw = W * 0.62; mh = mw * m.h / m.w; }
    var left = Math.max(W * 0.28, W * 0.54 - mw / 2), top = (H - mh) / 2 + H * 0.01;
    mapBox = { left: left, top: top, w: mw, h: mh, s: mh / m.h };
    decor.innerHTML = '<svg style="left:' + left + 'px;top:' + top + 'px;width:' + mw + 'px;height:' + mh + 'px" viewBox="0 0 ' + m.w + ' ' + m.h + '">' +
      '<defs><linearGradient id="sand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6e7cc" stop-opacity=".22"/><stop offset="1" stop-color="#e2c48f" stop-opacity=".12"/></linearGradient></defs>' +
      '<path d="' + m.d + '" fill="url(#sand)" stroke="rgba(255,255,255,.75)" stroke-width="' + (3 / mapBox.s) + '" stroke-linejoin="round"/></svg>';
    mapPath = new Path2D();
    mapPath.addPath(new Path2D(m.d), new DOMMatrix([mapBox.s, 0, 0, mapBox.s, left, top]));
  }

  var hit = document.createElement('canvas').getContext('2d');
  function slotsInMap(max) {
    // Shrink the cell until enough cells fit inside the map.
    var area = mapBox.w * mapBox.h * 0.9;
    var c = Math.sqrt(area / max), out = [];
    for (var k = 0; k < 90; k++) {
      out = [];
      for (var y = mapBox.top; y + c <= mapBox.top + mapBox.h; y += c * 1.05) {
        for (var x = mapBox.left - c * 0.3; x + c <= mapBox.left + mapBox.w + c * 0.3; x += c) {
          var cx = x + c / 2, cy = y + c / 2;
          if (hit.isPointInPath(mapPath, cx, cy) && hit.isPointInPath(mapPath, cx, y + c * 0.15) && hit.isPointInPath(mapPath, cx, y + c * 0.85)) {
            out.push({ x: x, y: y, rot: (Math.random() - .5) * 6, used: null });
          }
        }
      }
      if (out.length >= max) break;
      c *= 0.97;
    }
    // Keep only the cells closest to the middle of the map so drawings sit together.
    var mx = mapBox.left + mapBox.w / 2, my = mapBox.top + mapBox.h / 2;
    out.sort(function (a, b) { return Math.hypot(a.x - mx, a.y - my) - Math.hypot(b.x - mx, b.y - my); });
    out = out.slice(0, Math.max(max, 1));
    cell = c * 0.97 * bgOpt('items');
    out.forEach(function (s) {
      s.x += (c - cell) / 2; s.y += (c - cell) / 2;
      s.x = Math.max(4, Math.min(W - cell - 4, s.x)); s.y = Math.max(4, Math.min(H - cell - 4, s.y));
    });
    return out;
  }

  // Packed grid: exactly n cells, as big as they can be, filling the whole area.
  function slotsInGrid(n) {
    n = Math.max(1, n);
    var qr = document.querySelector('.join').getBoundingClientRect();
    var top = H * 0.13, left = 8;
    var aw = Math.max(200, qr.left - 12 - left), ah = H - top - 8;
    var LH = 1.12;                       // room under each drawing for the name
    var best = null;
    for (var cols = 1; cols <= n; cols++) {
      var rows = Math.ceil(n / cols);
      var c = Math.min(aw / cols, ah / (rows * LH));
      if (!best || c > best.c) best = { c: c, cols: cols, rows: rows };
    }
    var gridCell = best.c;
    cell = gridCell * 0.96 * bgOpt('items');
    // Center the packed block inside the area.
    var bw = best.cols * gridCell, bh = best.rows * gridCell * LH;
    var ox = left + (aw - bw) / 2, oy = top + (ah - bh) / 2;
    var out = [];
    for (var i = 0; i < n; i++) {
      var r = Math.floor(i / best.cols), col = i % best.cols;
      var inRow = Math.min(best.cols, n - r * best.cols);       // center a short last row
      var rx = ox + (best.cols - inRow) * gridCell / 2;
      var x = rx + col * gridCell + (gridCell - cell) / 2;
      var y = oy + r * gridCell * LH + (gridCell - cell) / 2;
      out.push({ x: x, y: y, rot: (Math.random() - .5) * 6, used: null });
    }
    return out;
  }

  // Auto size: few drawings = big, more drawings = smaller, up to the wall's max.
  var capacity = 0;
  function wantCap(n) { return Math.min(maxOnWall(), Math.max(1, n)); }
  function ensureRoom() {
    if (freeSlot() || capacity >= maxOnWall()) return;
    layout(items.size + 1);
  }
  function layout(n) {
    W = innerWidth; H = innerHeight;
    drawDecor();
    capacity = wantCap(n === undefined ? items.size : n);
    slots = theme === 'qatar' ? slotsInMap(capacity) : slotsInGrid(capacity);
    // Never drop drawings because the grid rounded down.
    var need = n === undefined ? items.size : Math.max(n, items.size);
    while (slots.length < Math.min(need, maxOnWall()) && capacity < maxOnWall() * 1.5) {
      capacity += 2;
      slots = theme === 'qatar' ? slotsInMap(capacity) : slotsInGrid(capacity);
    }
    // Put existing drawings back, newest first.
    var list = Array.from(items.values()).sort(function (a, b) { return b.row.created_at < a.row.created_at ? -1 : 1; });
    list.forEach(function (it) {
      var s = freeSlot();
      if (!s) { removeItem(it.row.id, true); return; }
      s.used = it.row.id; it.slot = s;
      it.el.style.transition = 'transform 1s cubic-bezier(.5,0,.2,1)';
      placeAt(it, s);
    });
  }

  function freeSlot() {
    var free = slots.filter(function (s) { return !s.used; });
    return free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  function placeAt(it, s) {
    it.el.style.width = cell + 'px';
    it.el.style.transform = 'translate(' + s.x + 'px,' + s.y + 'px) rotate(' + s.rot + 'deg)';
  }
  function setXY(it, x, y, scale) {
    it.el.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + scale + ')';
  }

  function makeEl(row) {
    var el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = '<div class="sway" style="animation-delay:-' + (Math.random() * 5).toFixed(2) + 's">' +
      '<span class="banner"></span><img alt=""><div class="who"></div></div>';
    el.querySelector('img').src = DW.imageUrl(row.image_path);
    el.querySelector('.who').textContent = row.name || '';
    el.querySelector('.banner').textContent = row.name ? 'From ' + row.name : 'New drawing!';
    wall.appendChild(el);
    return el;
  }

  function oldest() {
    var o = null;
    items.forEach(function (it) { if (!o || it.row.created_at < o.row.created_at) o = it; });
    return o;
  }

  function removeItem(id, instant) {
    var it = items.get(id);
    if (!it) return;
    items.delete(id);
    if (it.slot) it.slot.used = null;
    if (instant) { it.el.remove(); return; }
    it.el.classList.add('leaving');
    setTimeout(function () { it.el.remove(); }, 900);
  }

  function addQuiet(row, delay) {
    ensureRoom();
    var s = freeSlot();
    if (!s) return;
    var it = { row: row, el: makeEl(row), slot: s };
    s.used = row.id; items.set(row.id, it);
    placeAt(it, s);
    it.el.style.opacity = 0;
    setTimeout(function () { it.el.style.opacity = 1; it.el.querySelector('img').classList.add('pop-anim'); }, delay);
  }

  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function imgReady(el) {
    var img = el.querySelector('img');
    return new Promise(function (r) { if (img.complete) r(); else { img.onload = r; img.onerror = r; } });
  }
  function ease(t) { return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

  // ---------------------------------------------------------------- arrivals
  // Every theme: pop big in the middle, then a theme-specific trip to the slot.
  async function popNew(row) {
    if (items.has(row.id)) return;
    ensureRoom();
    var s = freeSlot();
    if (!s) { var o = oldest(); if (o) { removeItem(o.row.id); s = freeSlot(); } }
    if (!s) return;
    var it = { row: row, el: makeEl(row), slot: s };
    s.used = row.id; items.set(row.id, it);
    refreshCount();
    await imgReady(it.el);

    var hurry = queue.length > 2;
    var big = Math.min(H * 0.42, W * 0.32);
    var cx = W / 2, cy = H / 2 - big / 2;           // top-centre of the big drawing
    if (theme === 'qatar' && mapBox) cx = mapBox.left + mapBox.w / 2;
    var el = it.el;
    el.style.width = cell + 'px';
    el.style.transition = 'none';
    el.classList.add('popping');

    if (theme === 'birthday') { await balloonDeliver(it, s, cx, cy, big, hurry); return; }
    if (theme === 'newyear') {
      setXY(it, cx - cell / 2, cy, 0.001);
      await fx.rocket(cx + (Math.random() - .5) * W * 0.3, cx, H / 2);
      fx.burst(cx, H / 2, 140);
    } else {
      setXY(it, cx - cell / 2, cy, 0.001);
    }
    el.getBoundingClientRect();
    el.style.transition = 'transform .7s cubic-bezier(.2,1.5,.4,1)';
    setXY(it, cx - cell / 2, cy, big / cell);
    if (theme === 'wedding') fx.heartBurst(cx, cy + big / 2, big);
    await wait(hurry ? 1200 : 2400);

    if (theme === 'qatar') {
      await falconCarry(it, s, cx, cy, big, hurry);
    } else {
      el.style.transition = '';
      el.classList.remove('popping');
      placeAt(it, s);
      await wait(700);
    }
  }

  function enqueue(row) {
    if (!row || row.hidden || row.event !== DW.EVENT || items.has(row.id)) return;
    if (queue.some(function (q) { return q.id === row.id; })) return;
    queue.push(row); pump();
  }
  async function pump() {
    if (busy) return;
    busy = true;
    while (queue.length) {
      try { await popNew(queue.shift()); } catch (e) { console.error(e); }
    }
    busy = false;
  }

  // ---------------------------------------------------------------- falcon
  var falcon = document.getElementById('falcon'), fbody = falcon.querySelector('.body');
  var fdir = 1;
  function sizeFalcon() {
    var fw = Math.max(170, Math.min(380, Math.min(W, H) * 0.34));
    var fh = fw * 0.65;
    fbody.style.width = fw + 'px'; fbody.style.height = fh + 'px';
    // Talons (100, 96 in the 200 x 130 viewBox) sit on the falcon's origin.
    fbody.style.left = (-fw * 0.5) + 'px'; fbody.style.top = (-fh * 96 / 130) + 'px';
    fbody.style.transformOrigin = (fw * 0.5) + 'px ' + (fh * 96 / 130) + 'px';
  }
  function setFalcon(p, dx, dy) {
    if (dx !== undefined && Math.abs(dx) > 0.3) fdir = dx < 0 ? -1 : 1;
    var a = dx !== undefined ? Math.atan2(dy, Math.abs(dx) + 0.001) : 0;
    a = Math.max(-0.55, Math.min(0.55, a));
    falcon.style.transform = 'translate(' + p.x + 'px,' + p.y + 'px)';
    fbody.style.transform = 'scaleX(' + fdir + ') rotate(' + a + 'rad)';
  }
  function cr(pts, t) {
    var n = pts.length - 1, f = Math.min(t * n, n - 1e-6), i = Math.floor(f), u = f - i;
    var p0 = pts[Math.max(i - 1, 0)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(i + 2, n)];
    function c(a, b, d, e) { return 0.5 * (2 * b + (-a + d) * u + (2 * a - 5 * b + 4 * d - e) * u * u + (-a + 3 * b - 3 * d + e) * u * u * u); }
    return { x: c(p0.x, p1.x, p2.x, p3.x), y: c(p0.y, p1.y, p2.y, p3.y) };
  }
  function fly(pts, dur, onStep, easing) {
    return new Promise(function (res) {
      var t0 = performance.now(), prev = cr(pts, 0);
      (function f(now) {
        var t = Math.min(1, (now - t0) / dur), e = easing ? easing(t) : t, p = cr(pts, e);
        setFalcon(p, p.x - prev.x, p.y - prev.y); prev = p;
        if (onStep) onStep(p, e);
        if (t < 1) requestAnimationFrame(f); else res();
      })(t0);
    });
  }

  function animatePath(pts, dur, onStep, easing) {
    return new Promise(function (res) {
      var t0 = performance.now();
      (function f(now) {
        var t = Math.min(1, (now - t0) / dur), e = easing ? easing(t) : t;
        onStep(cr(pts, e), e);
        if (t < 1) requestAnimationFrame(f); else res();
      })(t0);
    });
  }

  // ---------------------------------------------------------------- balloons (birthday)
  var balloons = document.getElementById('balloons'), bbody = balloons.querySelector('.body');
  function sizeBalloons(w) {
    var h = w * 160 / 120;
    bbody.style.width = w + 'px'; bbody.style.height = h + 'px';
    bbody.style.left = (-w / 2) + 'px'; bbody.style.top = (-h * 158 / 160) + 'px';
    bbody.style.transformOrigin = (w / 2) + 'px ' + (h * 158 / 160) + 'px';
  }
  function setBalloons(p, k) {
    balloons.style.transform = 'translate(' + p.x + 'px,' + p.y + 'px)';
    bbody.style.transform = 'scale(' + k + ')';
  }
  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

  async function balloonDeliver(it, s, cx, cy, big, hurry) {
    var el = it.el, k0 = big / cell;
    cy = Math.min(cy + H * 0.14, H - big - 20);   // leave room above for the balloons
    sizeBalloons(big * 0.6);
    balloons.style.display = 'block';
    // Float up from below the screen to the middle.
    var start = { x: cx + (Math.random() - .5) * W * 0.25, y: H + 30 };
    await animatePath([start, { x: cx + (Math.random() - .5) * W * 0.1, y: (H + cy) / 2 }, { x: cx, y: cy }], hurry ? 1400 : 2400,
      function (p) { setXY(it, p.x - cell / 2, p.y, k0); setBalloons(p, 1); }, easeOut);
    await wait(hurry ? 900 : 1800);
    // Drift to the slot, shrinking to wall size.
    el.classList.remove('popping'); el.classList.add('carried');
    var target = { x: s.x + cell / 2, y: s.y }, k = 1;
    await animatePath([{ x: cx, y: cy }, { x: (cx + target.x) / 2 + (Math.random() - .5) * W * 0.15, y: Math.min(cy, target.y) - H * 0.08 }, target],
      hurry ? 1200 : 2000, function (p, e) { var ks = k0 + (1 - k0) * e; k = ks / k0; setXY(it, p.x - cell / 2, p.y, ks); setBalloons(p, k); }, ease);
    el.classList.remove('carried');
    el.style.transition = 'transform .6s cubic-bezier(.2,1.6,.4,1)';
    placeAt(it, s);
    setTimeout(function () { el.style.transition = ''; }, 700);
    // Let go of the balloons.
    var drift = (Math.random() - .5) * 200;
    await animatePath([target, { x: target.x + drift * 0.5, y: target.y - H * 0.35 }, { x: target.x + drift, y: -H * 0.3 }], 1700,
      function (p) { setBalloons(p, k); }, function (t) { return t * t; });
    balloons.style.display = 'none';
  }

  async function falconCarry(it, s, cx, cy, big, hurry) {
    sizeFalcon();
    var fromLeft = Math.random() < .5, side = fromLeft ? -1 : 1;
    var start = { x: fromLeft ? -220 : W + 220, y: H * 0.18 };
    falcon.style.display = 'block';
    falcon.classList.remove('glide');
    setFalcon(start, -side, 0);
    // Swoop in and grab the drawing by its top.
    await fly([start, { x: cx + side * W * 0.22, y: H * 0.05 }, { x: cx + side * W * 0.06, y: cy - H * 0.06 }, { x: cx, y: cy }], hurry ? 800 : 1200, null, ease);
    it.el.classList.remove('popping'); it.el.classList.add('carried');
    it.el.style.transition = 'none';

    // Play with it: a loop around the screen, shrinking to wall size, then to the slot.
    var r = Math.min(W, H) * 0.26, mx = cx, my = H * 0.5;
    var target = { x: s.x + cell / 2, y: s.y };
    var loop = hurry ? [{ x: cx, y: cy }, { x: (cx + target.x) / 2 - side * r * 0.6, y: Math.min(cy, target.y) - r * 0.4 }, target]
      : [{ x: cx, y: cy }, { x: mx - side * r, y: my - r * 0.9 }, { x: mx - side * r * 1.4, y: my }, { x: mx, y: my + r * 0.7 },
         { x: mx + side * r * 1.3, y: my - r * 0.2 }, { x: mx + side * r * 0.5, y: my - r }, { x: (mx + target.x) / 2, y: Math.min(my - r * 0.6, target.y - r * 0.3) }, target];
    var s0 = big / cell;
    await fly(loop, hurry ? 1400 : 3400, function (p, e) {
      setXY(it, p.x - cell / 2, p.y, s0 + (1 - s0) * Math.min(1, e * 1.4));
    }, ease);

    // Drop it with a little bounce and fly away.
    it.el.classList.remove('carried');
    it.el.style.transition = 'transform .6s cubic-bezier(.2,1.6,.4,1)';
    placeAt(it, s);
    setTimeout(function () { it.el.style.transition = ''; }, 700);
    falcon.classList.add('glide');
    var exitX = target.x < W / 2 ? -260 : W + 260;
    await fly([target, { x: target.x + (exitX > 0 ? 1 : -1) * W * 0.15, y: target.y - H * 0.25 }, { x: exitX, y: -120 }], 1100, null, function (t) { return t * t; });
    falcon.style.display = 'none';
  }

  // ---------------------------------------------------------------- background effects
  var fx = (function () {
    var cv = document.getElementById('fx'), c = cv.getContext('2d');
    var mode = 'christmas', flakes = [], stars = [], sparks = [], rockets = [], nextAmbient = 0;
    function size() { cv.width = innerWidth; cv.height = innerHeight; }
    size(); addEventListener('resize', size);
    for (var i = 0; i < 150; i++) flakes.push({ x: Math.random(), y: Math.random(), r: Math.random() * 2.4 + .6, s: Math.random() * .0012 + .0004, d: Math.random() * 6.28 });
    for (i = 0; i < 160; i++) stars.push({ x: Math.random(), y: Math.random(), r: Math.random() * 1.6 + .3, p: Math.random() * 6.28 });
    var COLORS = ['#ffe066', '#e8b64c', '#f28cb8', '#4cc9f0', '#b5e853', '#ffffff', '#e5484d', '#8a5cd6'];

    function burst(x, y, n, palette) {
      var col = (palette || COLORS)[Math.floor(Math.random() * (palette || COLORS).length)];
      var col2 = COLORS[Math.floor(Math.random() * COLORS.length)];
      for (var i = 0; i < n; i++) {
        var a = Math.random() * 6.28, v = Math.random() * 4.5 + 1.5;
        sparks.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: 60 + Math.random() * 40, c: i % 3 ? col : col2, r: Math.random() * 2 + 1.2 });
      }
    }
    // Sparkles that open out into a heart shape (wedding).
    function heartBurst(x, y, size) {
      var k = size / 40, cols = ['#f4c2c2', '#e8909c', '#d4af37', '#ffffff'];
      for (var i = 0; i < 110; i++) {
        var a = (i / 110) * 6.283;
        var hx = 16 * Math.pow(Math.sin(a), 3);
        var hy = -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a));
        sparks.push({ x: x, y: y, vx: hx * k * 0.17, vy: hy * k * 0.17, life: 0, max: 80 + Math.random() * 20,
          c: cols[i % cols.length], r: Math.random() * 1.8 + 1.4, nograv: true });
      }
    }

    function rocket(fromX, toX, toY) {
      return new Promise(function (res) {
        rockets.push({ x: fromX, y: innerHeight + 10, sx: fromX, tx: toX, ty: toY, t: 0, dur: 55, done: res });
      });
    }

    function tick(t) {
      c.clearRect(0, 0, cv.width, cv.height);
      if (mode === 'christmas') {
        c.fillStyle = 'rgba(255,255,255,.75)';
        flakes.forEach(function (f) {
          f.y += f.s; if (f.y > 1.02) { f.y = -0.02; f.x = Math.random(); }
          var x = (f.x + Math.sin(t / 2000 + f.d) * 0.01) * cv.width;
          c.beginPath(); c.arc(x, f.y * cv.height, f.r, 0, 6.28); c.fill();
        });
      } else if (mode === 'qatar') {
        // Warm drifting dust and a few stars.
        flakes.forEach(function (f, i) {
          f.x += f.s * 0.6; if (f.x > 1.02) { f.x = -0.02; f.y = Math.random(); }
          var y = (f.y + Math.sin(t / 2500 + f.d) * 0.01) * cv.height;
          c.fillStyle = i % 3 ? 'rgba(246,231,204,.35)' : 'rgba(232,182,76,.5)';
          c.beginPath(); c.arc(f.x * cv.width, y, f.r * 0.8, 0, 6.28); c.fill();
        });
      } else if (mode === 'birthday') {
        flakes.forEach(function (f, i) {
          f.y += f.s * 1.6; if (f.y > 1.02) { f.y = -0.02; f.x = Math.random(); }
          var x = (f.x + Math.sin(t / 1500 + f.d) * 0.015) * cv.width;
          c.save(); c.translate(x, f.y * cv.height); c.rotate(t / 400 + f.d * 3);
          c.globalAlpha = .85; c.fillStyle = COLORS[i % COLORS.length];
          c.fillRect(-f.r * 1.6, -f.r * 0.8, f.r * 3.2, f.r * 1.6);
          c.restore();
        });
      } else if (mode === 'wedding') {
        stars.forEach(function (s, i) {
          if (i % 3) return;
          c.fillStyle = 'rgba(244,215,140,' + (0.25 + 0.5 * Math.abs(Math.sin(t / 1100 + s.p))) + ')';
          c.beginPath(); c.arc(s.x * cv.width, s.y * cv.height, s.r, 0, 6.28); c.fill();
        });
        flakes.forEach(function (f, i) {
          if (i % 2) return;
          f.y += f.s * 0.7; if (f.y > 1.02) { f.y = -0.02; f.x = Math.random(); }
          var x = (f.x + Math.sin(t / 2200 + f.d) * 0.03) * cv.width;
          c.save(); c.translate(x, f.y * cv.height); c.rotate(t / 1300 + f.d * 2);
          c.globalAlpha = .8; c.fillStyle = i % 4 ? '#f4c2c2' : '#fff2f4';
          c.beginPath(); c.ellipse(0, 0, f.r * 2.6, f.r * 1.4, 0, 0, 6.28); c.fill();
          c.restore();
        });
      } else if (mode === 'newyear') {
        stars.forEach(function (s) {
          c.fillStyle = 'rgba(255,255,255,' + (0.35 + 0.45 * Math.abs(Math.sin(t / 900 + s.p))) + ')';
          c.beginPath(); c.arc(s.x * cv.width, s.y * cv.height * 0.85, s.r, 0, 6.28); c.fill();
        });
        if (t > nextAmbient) {
          nextAmbient = t + 2500 + Math.random() * 3500;
          burst(cv.width * (0.1 + Math.random() * 0.8), cv.height * (0.12 + Math.random() * 0.3), 60);
        }
      }
      // Rockets and sparks run in every mode (only New Year launches them).
      rockets = rockets.filter(function (r) {
        r.t++;
        var k = r.t / r.dur, e = 1 - Math.pow(1 - k, 2);
        var px = r.sx + (r.tx - r.sx) * e, py = (innerHeight + 10) + (r.ty - innerHeight - 10) * e;
        sparks.push({ x: px, y: py, vx: (Math.random() - .5) * .6, vy: Math.random() * .8, life: 0, max: 22, c: '#ffe8a3', r: 1.6 });
        c.fillStyle = '#fff'; c.beginPath(); c.arc(px, py, 3, 0, 6.28); c.fill();
        if (r.t >= r.dur) { r.done(); return false; }
        return true;
      });
      sparks = sparks.filter(function (p) {
        p.life++; p.x += p.vx; p.y += p.vy;
        if (p.nograv) { p.vx *= 0.94; p.vy *= 0.94; } else { p.vx *= 0.97; p.vy = p.vy * 0.97 + 0.05; }
        var a = 1 - p.life / p.max;
        if (a <= 0) return false;
        c.globalAlpha = a; c.fillStyle = p.c;
        c.beginPath(); c.arc(p.x, p.y, p.r, 0, 6.28); c.fill();
        c.globalAlpha = 1;
        return true;
      });
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
    return { setMode: function (m) { mode = m; }, burst: burst, rocket: rocket, heartBurst: heartBurst };
  })();

  // ---------------------------------------------------------------- data
  var total = 0;
  function updateCount() {
    document.getElementById('count').textContent = total ? total + (total === 1 ? ' drawing' : ' drawings') : '';
  }
  async function refreshCount() {
    var res = await db.from(DW.TABLE).select('id', { count: 'exact', head: true }).eq('event', DW.EVENT).eq('hidden', false);
    if (!res.error) { total = res.count || 0; updateCount(); }
  }
  async function fetchRows() {
    var res = await db.from(DW.TABLE).select('id,created_at,event,name,shape,image_path,hidden', { count: 'exact' })
      .eq('event', DW.EVENT).order('created_at', { ascending: false }).limit(maxOnWall());
    if (res.error) throw res.error;
    total = res.count || res.data.length;
    return res.data;
  }

  // Poll as a safety net: catches anything realtime missed, hidden drawings and theme changes.
  async function sync() {
    try {
      var rows = await fetchRows();
      document.getElementById('offline').style.display = 'none';
      var ids = new Set(rows.map(function (r) { return r.id; }));
      items.forEach(function (it, id) { if (!ids.has(id) && !queue.length && !busy) removeItem(id); });
      rows.slice().reverse().forEach(enqueue);
      updateCount();
      var c = await DW.loadEvent(db);
      if (c.theme !== cfg.theme || c.title !== cfg.title || c.tagline !== cfg.tagline ||
          JSON.stringify(c.backgrounds || {}) !== JSON.stringify(cfg.backgrounds || {})) applyTheme(c);
    } catch (e) {
      console.error(e);
      document.getElementById('offline').style.display = 'block';
    }
  }

  async function init() {
    applyTheme(await DW.loadEvent(db));
    try {
      var rows = await fetchRows();
      layout(rows.length);
      rows.forEach(function (r, i) { addQuiet(r, 80 * i); });
      updateCount();
    } catch (e) { console.error(e); document.getElementById('offline').style.display = 'block'; }

    db.channel('doodle-' + DW.EVENT)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: DW.TABLE, filter: 'event=eq.' + DW.EVENT },
        function (payload) { enqueue(payload.new); refreshCount(); })
      .on('postgres_changes', { event: '*', schema: 'public', table: DW.EVENTS_TABLE, filter: 'event=eq.' + DW.EVENT },
        function (payload) { if (payload.new && payload.new.theme) applyTheme(payload.new); })
      .subscribe();
    setInterval(sync, 15000);
  }

  var rt;
  addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(layout, 300); });

  // ---------------------------------------------------------------- shuffle
  // Every 5 seconds a few drawings glide to a new spot: swap with another
  // drawing, or move into an empty slot. Drawings that are arriving are left alone.
  function settled(it) {
    var c = it.el.classList;
    return !c.contains('popping') && !c.contains('carried') && !c.contains('leaving');
  }
  function moveTo(it, s) {
    if (it.slot) it.slot.used = null;
    s.used = it.row.id; it.slot = s;
    it.el.style.transition = 'transform 1.6s cubic-bezier(.45,0,.2,1)';
    placeAt(it, s);
  }
  function shuffleTick() {
    if (document.hidden) return;
    // Drawings were hidden or cleared: grow the rest back.
    if (!busy && !queue.length && items.size && wantCap(items.size) < capacity) { layout(); return; }
    var list = Array.from(items.values()).filter(settled);
    if (!list.length) return;
    var n = Math.max(1, Math.min(4, Math.round(list.length * 0.2)));
    for (var i = 0; i < n; i++) {
      var a = list[Math.floor(Math.random() * list.length)];
      var free = slots.filter(function (s) { return !s.used; });
      var others = list.filter(function (x) { return x !== a; });
      if (free.length && (Math.random() < 0.5 || !others.length)) {
        moveTo(a, free[Math.floor(Math.random() * free.length)]);
      } else if (others.length) {
        var b = others[Math.floor(Math.random() * others.length)];
        var sa = a.slot, sb = b.slot;
        sa.used = null; sb.used = null; a.slot = null; b.slot = null;
        moveTo(a, sb); moveTo(b, sa);
      }
    }
  }
  setInterval(shuffleTick, 5000);

  // Debug helper for previews: DW_test() pops the newest drawing again.
  window.DW_test = function () {
    var o = Array.from(items.values()).pop();
    if (!o) return 'no drawings';
    var row = Object.assign({}, o.row, { id: o.row.id + '-t' + Date.now() });
    queue.push(row); pump(); return 'ok';
  };

  init();
})();
</script>
</body>
